<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My lovieee Aprill</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Import MediaPipe Hands and Camera Utils -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <!-- Import Three.js as a module -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <video class="input_video"></video>
    <canvas class="output_canvas"></canvas>
    <div id="loading">Tunggu sebentar ya sayangg</div>
    <div id="debug-console"
        style="position:fixed; bottom:0; left:0; width:100%; height:150px; background:rgba(0,0,0,0.8); color:lime; overflow:auto; font-family:monospace; font-size:12px; pointer-events:none; z-index:9999; display:block;">
    </div>

    <script>
        // Override console to show on screen
        const debugConsole = document.getElementById('debug-console');
        function logToScreen(msg, type = 'log') {
            const div = document.createElement('div');
            div.textContent = `[${type.toUpperCase()}] ${msg}`;
            if (type === 'error') div.style.color = 'red';
            debugConsole.appendChild(div);
            debugConsole.scrollTop = debugConsole.scrollHeight;
        }
        const originalLog = console.log;
        const originalError = console.error;
        console.log = function (...args) {
            originalLog.apply(console, args);
            logToScreen(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
        };
        console.error = function (...args) {
            originalError.apply(console, args);
            logToScreen(args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '), 'error');
        };
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            logToScreen(`${msg} at ${lineNo}:${columnNo}`, 'error');
            return false;
        };
    </script>

    <script type="module" src="script.js"></script>
</body>

</html>
